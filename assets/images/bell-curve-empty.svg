<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="emptyCurveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Normal Distribution Bell Curve Path (mean=100, sd=15, bounds 40 to 160) -->
  <path d="M 80,180 C 130,179 170,176 210,165 C 250,150 290,120 330,75 C 360,40 380,25 400,25 C 420,25 440,40 470,75 C 510,120 550,150 590,165 C 630,176 670,179 720,180 Z" fill="url(#emptyCurveGrad)" />
  <path d="M 80,180 C 130,179 170,176 210,165 C 250,150 290,120 330,75 C 360,40 380,25 400,25 C 420,25 440,40 470,75 C 510,120 550,150 590,165 C 630,176 670,179 720,180" fill="none" stroke="#2563eb" stroke-width="2.5" />

  <!-- Base Baseline Axis -->
  <line x1="80" y1="180" x2="720" y2="180" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Standard Deviation Grid Lines -->
  <!-- -3 SD (SS: 55) -->
  <line x1="160" y1="40" x2="160" y2="180" stroke="#cbd5e1" stroke-dasharray="3 3" stroke-width="1" />
  <text x="160" y="196" font-size="11" text-anchor="middle" font-weight="600" fill="#334155">55</text>
  <text x="160" y="210" font-size="10" text-anchor="middle" fill="#64748b">-3&#963;</text>
  <text x="160" y="223" font-size="9" text-anchor="middle" fill="#94a3b8">0.1%</text>

  <!-- -2 SD (SS: 70) -->
  <line x1="240" y1="40" x2="240" y2="180" stroke="#cbd5e1" stroke-dasharray="3 3" stroke-width="1" />
  <text x="240" y="196" font-size="11" text-anchor="middle" font-weight="600" fill="#334155">70</text>
  <text x="240" y="210" font-size="10" text-anchor="middle" fill="#64748b">-2&#963;</text>
  <text x="240" y="223" font-size="9" text-anchor="middle" fill="#94a3b8">2%</text>

  <!-- -1 SD (SS: 85) -->
  <line x1="320" y1="40" x2="320" y2="180" stroke="#cbd5e1" stroke-dasharray="3 3" stroke-width="1" />
  <text x="320" y="196" font-size="11" text-anchor="middle" font-weight="600" fill="#334155">85</text>
  <text x="320" y="210" font-size="10" text-anchor="middle" fill="#64748b">-1&#963;</text>
  <text x="320" y="223" font-size="9" text-anchor="middle" fill="#94a3b8">16%</text>

  <!-- Mean 0 SD (SS: 100) -->
  <line x1="400" y1="25" x2="400" y2="180" stroke="#3b82f6" stroke-dasharray="3 3" stroke-width="1.5" />
  <text x="400" y="196" font-size="11" text-anchor="middle" font-weight="700" fill="#1e293b">100</text>
  <text x="400" y="210" font-size="10" text-anchor="middle" font-weight="600" fill="#2563eb">Mean</text>
  <text x="400" y="223" font-size="9" text-anchor="middle" fill="#94a3b8">50%</text>

  <!-- +1 SD (SS: 115) -->
  <line x1="480" y1="40" x2="480" y2="180" stroke="#cbd5e1" stroke-dasharray="3 3" stroke-width="1" />
  <text x="480" y="196" font-size="11" text-anchor="middle" font-weight="600" fill="#334155">115</text>
  <text x="480" y="210" font-size="10" text-anchor="middle" fill="#64748b">+1&#963;</text>
  <text x="480" y="223" font-size="9" text-anchor="middle" fill="#94a3b8">84%</text>

  <!-- +2 SD (SS: 130) -->
  <line x1="560" y1="40" x2="560" y2="180" stroke="#cbd5e1" stroke-dasharray="3 3" stroke-width="1" />
  <text x="560" y="196" font-size="11" text-anchor="middle" font-weight="600" fill="#334155">130</text>
  <text x="560" y="210" font-size="10" text-anchor="middle" fill="#64748b">+2&#963;</text>
  <text x="560" y="223" font-size="9" text-anchor="middle" fill="#94a3b8">98%</text>

  <!-- +3 SD (SS: 145) -->
  <line x1="640" y1="40" x2="640" y2="180" stroke="#cbd5e1" stroke-dasharray="3 3" stroke-width="1" />
  <text x="640" y="196" font-size="11" text-anchor="middle" font-weight="600" fill="#334155">145</text>
  <text x="640" y="210" font-size="10" text-anchor="middle" fill="#64748b">+3&#963;</text>
  <text x="640" y="223" font-size="9" text-anchor="middle" fill="#94a3b8">99.9%</text>
</svg>

